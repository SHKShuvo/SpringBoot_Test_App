server.port=${SERVER_PORT:8091}

# Oracle DB connection
# You can run from any PC by changing only environment variables, no code change required.
# Example service-name URL: jdbc:oracle:thin:@//localhost:1521/orcl
# Example SID URL:          jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
spring.datasource.username=${ORACLE_DB_USERNAME:shuvo}
spring.datasource.password=${ORACLE_DB_PASSWORD:shuvo}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Hibernate DDL Auto: use validate/none in production; update is okay for local development.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Batch transaction settings
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=*

# Application log folder. Default works on Windows/Linux/Mac.
app.log.path=${APP_LOG_PATH:${user.home}/test-api-logs/}

# Manual JDBC connection used by DBConnection.java
app.auth-db.url=jdbc:oracle:thin:@//localhost:1521/orcl
app.auth-db.username=shuvo
app.auth-db.password=shuvo
