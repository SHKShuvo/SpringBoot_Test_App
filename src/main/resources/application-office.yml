server:
  port: ${SERVER_PORT:8091}

spring:
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
    username: ${ORACLE_DB_USERNAME:shuvo}
    password: ${ORACLE_DB_PASSWORD:shuvo}
    driver-class-name: oracle.jdbc.OracleDriver

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: "*"

app:
  log:
    path: ${APP_LOG_PATH:${user.home}/test-api-logs/}

  auth-db:
    url: ${AUTH_DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
    username: ${AUTH_DB_USERNAME:shuvo}
    password: ${AUTH_DB_PASSWORD:shuvo}